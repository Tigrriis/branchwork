# Every word a person reads in Villainy.
#
# Edit the text between the quotes and reload the page; nothing else needs
# touching. A few rules keep it working:
#
#   * Words in {braces} are filled in by the app. Keep them, in any order,
#     but don't rename or drop them: {name} must stay {name}.
#   * Straight double quotes inside a line need a backslash: \"like this\".
#     Curly quotes “ ” need nothing.
#   * A comment line directly above a key describes where that text shows.
#   * Keys starting with an underscore are labels for the copy editor, not
#     text the app shows.

