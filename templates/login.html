{% extends "base.html" %}
{% block title %}Sign in · {{ SITE_NAME }}{% endblock %}
{% block main_class %}page page--centre{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-card__head">
    <h1>Sign in</h1>
    <p class="muted">Plan the tree, tick the branches.</p>
  </div>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label class="field__label" for="email">Email</label>
      <input class="input" type="email" id="email" name="email" required autocomplete="email" autofocus>
    </div>
    <div class="field">
      <label class="field__label" for="password">Password</label>
      <input class="input" type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <label class="check"><input type="checkbox" name="remember" value="1"> Keep me signed in</label>
    <button class="btn btn--primary btn--block" type="submit">Sign in</button>
  </form>
  <p class="auth-alt">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
