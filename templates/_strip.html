{# 12-week activity strip. Pass counts=list[int], oldest first. #}
{% set peak = counts|max if counts else 0 %}
<span class="strip" title="Activity over the last {{ counts|length }} weeks">
  {% for n in counts %}
  {% set level = 0 if n == 0 else (1 if n <= 1 else (2 if n < peak else 3)) %}
  <span class="strip__cell strip__cell--{{ level }}" title="{{ n }} event{{ '' if n == 1 else 's' }}"></span>
  {% endfor %}
</span>
