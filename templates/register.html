{% extends "base.html" %}
{% block title %}Create an account · {{ SITE_NAME }}{% endblock %}
{% block main_class %}page page--centre{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-card__head">
    <h1>Create an account</h1>
    <p class="muted">Your projects are private to you.</p>
  </div>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label class="field__label" for="display_name">Name <span class="muted">(optional)</span></label>
      <input class="input" type="text" id="display_name" name="display_name" maxlength="80" autocomplete="name">
    </div>
    <div class="field">
      <label class="field__label" for="email">Email</label>
      <input class="input" type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div class="field">
      <label class="field__label" for="password">Password <span class="muted">(8+ characters)</span></label>
      <input class="input" type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
    </div>
    <button class="btn btn--primary btn--block" type="submit">Create account</button>
  </form>
  <p class="auth-alt">Already have one? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
</div>
{% endblock %}
